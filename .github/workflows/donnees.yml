name: Telecharger les donnees de marche

on:
  workflow_dispatch:
  schedule:
    - cron: "17 22 * * 1-5"

permissions:
  contents: write

jobs:
  telecharger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas scipy matplotlib reportlab
      - run: python telecharger.py
      - name: Regenerer le rapport VT (sans requete Yahoo)
        run: python analysis.py
      - name: Enregistrer les donnees
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/ report/
          git diff --cached --quiet || git commit -m "Mise a jour des donnees et du rapport"
          git push
